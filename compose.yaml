services:
  copilot:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      COPILOT_FORCE_PREVIEW: ${COPILOT_FORCE_PREVIEW:-false}
      COPILOT_DB_PATH: /data/copilot.sqlite
      LIARA_API_TOKEN: ${LIARA_API_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - copilot-data:/data
volumes:
  copilot-data:
